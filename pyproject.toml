[project]
name = "telegram-userbot"
# Keep in sync with userbot/__init__.py (scripts/build_bundle.py checks it).
version = "0.1.0"
description = "Telegram userbot that auto-replies with a local AI (Ollama)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.45,<2",
    "python-dotenv>=1.0",
    "ollama>=0.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "questionary>=2.0",
    "platformdirs>=4",
    "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The tester bundle runs the code from its folder (`python -m userbot`);
# it isn't installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
